<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Custom CMS interface placeholder</title>
  <desc id="desc">Conceptual light administration dashboard with navigation, content table and status controls.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#1d2320" flood-opacity=".16"/></filter></defs>
  <rect width="1200" height="800" fill="#e7e1d5"/><circle cx="1030" cy="650" r="270" fill="#b9f34a" opacity=".32"/>
  <g transform="translate(68 70)" filter="url(#s)">
    <rect width="1064" height="660" rx="22" fill="#fbfbf8"/>
    <rect width="205" height="660" rx="22" fill="#191b1e"/><rect x="184" width="21" height="660" fill="#191b1e"/>
    <text x="32" y="52" fill="#b9f34a" font-family="Arial,sans-serif" font-size="20" font-weight="700">NP / CMS</text>
    <text x="32" y="105" fill="#8d9197" font-family="Arial,sans-serif" font-size="9" letter-spacing="2">WORKSPACE</text>
    <rect x="20" y="126" width="165" height="44" rx="8" fill="#2b2f33"/><circle cx="41" cy="148" r="6" fill="#b9f34a"/><text x="58" y="152" fill="#fff" font-family="Arial,sans-serif" font-size="12">Overview</text>
    <g fill="#969ba1" font-family="Arial,sans-serif" font-size="12"><text x="58" y="210">Pages</text><text x="58" y="257">Posts</text><text x="58" y="304">Media</text><text x="58" y="351">Forms</text><text x="58" y="398">Integrations</text></g>
    <rect x="27" y="574" width="150" height="54" rx="9" fill="#23262a"/><circle cx="52" cy="601" r="13" fill="#42474d"/><text x="74" y="598" fill="#fff" font-family="Arial,sans-serif" font-size="10">Administrator</text><text x="74" y="613" fill="#81868c" font-family="Arial,sans-serif" font-size="8">Secure session</text>
    <g transform="translate(250 42)">
      <text x="0" y="18" fill="#7e8281" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">CONTENT OPERATIONS</text>
      <text x="0" y="58" fill="#17191b" font-family="Arial,sans-serif" font-size="30" font-weight="700">Good morning, Naeem</text>
      <rect x="626" y="18" width="138" height="44" rx="8" fill="#17191b"/><text x="695" y="45" fill="#fff" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">+ New article</text>
      <g transform="translate(0 95)">
        <rect width="236" height="112" rx="13" fill="#f0f0eb"/><text x="22" y="31" fill="#777c78" font-family="Arial,sans-serif" font-size="10">PUBLISHED</text><text x="22" y="78" fill="#17191b" font-family="Arial,sans-serif" font-size="32" font-weight="700">24</text><circle cx="199" cy="55" r="18" fill="#b9f34a"/>
        <rect x="254" width="236" height="112" rx="13" fill="#f0f0eb"/><text x="276" y="31" fill="#777c78" font-family="Arial,sans-serif" font-size="10">DRAFTS</text><text x="276" y="78" fill="#17191b" font-family="Arial,sans-serif" font-size="32" font-weight="700">06</text><circle cx="453" cy="55" r="18" fill="#dddeda"/>
        <rect x="508" width="256" height="112" rx="13" fill="#202326"/><text x="530" y="31" fill="#9da2a6" font-family="Arial,sans-serif" font-size="10">INTEGRATIONS</text><text x="530" y="78" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Connected</text><circle cx="726" cy="55" r="7" fill="#b9f34a"/>
      </g>
      <g transform="translate(0 235)">
        <text x="0" y="20" fill="#17191b" font-family="Arial,sans-serif" font-size="16" font-weight="700">Recent content</text>
        <rect y="40" width="764" height="302" rx="13" fill="#fff" stroke="#dedfd9"/>
        <rect x="20" y="60" width="724" height="36" rx="7" fill="#f3f3ef"/><text x="36" y="82" fill="#878b89" font-family="Arial,sans-serif" font-size="9">TITLE</text><text x="495" y="82" fill="#878b89" font-family="Arial,sans-serif" font-size="9">STATUS</text><text x="640" y="82" fill="#878b89" font-family="Arial,sans-serif" font-size="9">UPDATED</text>
        <g font-family="Arial,sans-serif" font-size="11" fill="#242628"><text x="36" y="132">Product overview</text><text x="36" y="187">Customer support guide</text><text x="36" y="242">Service update</text><text x="36" y="297">Contact journey</text></g>
        <g fill="#dff6b7"><rect x="487" y="115" width="77" height="25" rx="13"/><rect x="487" y="225" width="77" height="25" rx="13"/></g><g fill="#eeeee8"><rect x="487" y="170" width="77" height="25" rx="13"/><rect x="487" y="280" width="77" height="25" rx="13"/></g>
        <g font-family="Arial,sans-serif" font-size="9" fill="#3a4b1e"><text x="525" y="131" text-anchor="middle">Published</text><text x="525" y="241" text-anchor="middle">Published</text></g><g font-family="Arial,sans-serif" font-size="9" fill="#666a67"><text x="525" y="186" text-anchor="middle">Draft</text><text x="525" y="296" text-anchor="middle">Review</text></g>
        <g font-family="Arial,sans-serif" font-size="10" fill="#7d817e"><text x="640" y="132">Today</text><text x="640" y="187">Yesterday</text><text x="640" y="242">Mon 14:20</text><text x="640" y="297">Fri 09:12</text></g>
      </g>
    </g>
  </g>
  <text x="1126" y="772" fill="#685f51" font-family="Arial,sans-serif" font-size="11" text-anchor="end" letter-spacing="2">INTERFACE PLACEHOLDER</text>
</svg>

