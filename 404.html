<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Naeem Patel</title>
  <meta name="description" content="The requested page could not be found. Return to Naeem Patel's portfolio.">
  <meta name="robots" content="noindex">
  <base href="/">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f3ee">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10110f">
  <script>
    // Keep this tiny script in the head so the correct theme is applied before first paint.
    (() => {
      try {
        const root = document.documentElement;
        const stored = window.localStorage.getItem('naeem-portfolio-theme');
        const theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.dataset.theme = theme;
        document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
          meta.content = theme === 'dark' ? '#10110f' : '#f4f3ee';
        });
        root.classList.add('js');
      } catch {
        document.documentElement.classList.add('js');
      }
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/sections.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="error-page">
  <main class="error-card">
    <a class="brand" href="index.html" aria-label="Naeem Patel — return to the portfolio">NP<span aria-hidden="true">.</span></a>
    <p class="error-card__code">Error / 404</p>
    <h1>This page has moved—or never existed.</h1>
    <p>The portfolio is still exactly where it should be. Head back to the main page to explore selected work and capabilities.</p>
    <a class="button button--accent" href="index.html">Return to the portfolio <span aria-hidden="true">→</span></a>
  </main>
  <script src="assets/js/theme.js" defer></script>
</body>
</html>
